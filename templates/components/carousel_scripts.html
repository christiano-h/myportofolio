{% comment %}
Skrip kartu carousel (`.portfolio-track`): kartu terdekat titik tengah track
ditandai `.is-active` supaya glare-nya tampil tanpa hover di layar kecil.
{% endcomment %}

<script>
    (function () {
        'use strict';

        // Mengikuti breakpoint mobile di style.css: @media (max-width: 720px).
        var MOBILE_MAX_WIDTH = 720;

        function clearActive(track) {
            var aktif = track.querySelectorAll('.is-active');
            Array.prototype.forEach.call(aktif, function (el) {
                el.classList.remove('is-active');
            });
        }

        function apply(track) {
            // Desktop (grid): biarkan glare hanya dari hover.
            if (window.innerWidth > MOBILE_MAX_WIDTH) {
                clearActive(track);
                return;
            }

            var kartu = track.querySelectorAll('.project-card-outline');
            if (!kartu.length) return;

            var trackRect = track.getBoundingClientRect();
            // Titik tengah area track yang terlihat di layar: benar untuk track yang
            // scroll sendiri (halaman manage) maupun halaman yang scroll normal.
            var atas = Math.max(trackRect.top, 0);
            var bawah = Math.min(trackRect.bottom, window.innerHeight);
            var centerY = atas + (bawah - atas) / 2;
            var terdekat = kartu[0];
            var jarakTerdekat = Infinity;

            Array.prototype.forEach.call(kartu, function (c) {
                var r = c.getBoundingClientRect();
                var jarak = Math.abs(r.top + r.height / 2 - centerY);
                if (jarak < jarakTerdekat) {
                    jarakTerdekat = jarak;
                    terdekat = c;
                }
            });

            clearActive(track);
            terdekat.classList.add('is-active');
            var dalam = terdekat.querySelector('.project-card');
            if (dalam) dalam.classList.add('is-active');
        }

        function initTrack(track) {
            var ticking = false;

            function onScroll() {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(function () {
                    apply(track);
                    ticking = false;
                });
            }

            track.addEventListener('scroll', onScroll, { passive: true });
            // Halaman yang scroll normal (HP): kartu aktif ikut berpindah saat digulir.
            window.addEventListener('scroll', onScroll, { passive: true });
            window.addEventListener('resize', function () { apply(track); });
            window.addEventListener('load', function () { apply(track); });
            apply(track);
        }

        function start() {
            var tracks = document.querySelectorAll('.portfolio-track');
            Array.prototype.forEach.call(tracks, initTrack);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', start);
        } else {
            start();
        }
    })();
</script>
